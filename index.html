<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d0e">
  <title>Yoroll · 游戏 UI 动效改版</title>
  <link rel="icon" href="wall/assets/yoroll-icon.svg">
  <link rel="stylesheet" href="style.css?v=death-embers-visible-20261114">
  <link rel="preload" as="fetch" href="assets/audio/home-opening.wav?v=opening-fade-20261111" crossorigin="anonymous">
</head>
<body>
  <main id="game-frame" class="game-frame" aria-label="Yoroll 游戏界面预览">
    <div class="scene" id="scene" aria-hidden="true"></div>
    <div class="left-blur" aria-hidden="true"></div>
    <div class="scene-shade" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div id="screen" class="screen"></div>
    <div id="modal-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <button id="review-toggle" class="review-toggle" aria-label="打开页面动效预览导航" aria-expanded="false">预览 <span>⌘</span></button>
  <aside id="review-panel" class="review-panel" hidden aria-label="页面动效预览导航">
    <div class="review-heading"><strong>页面与动效</strong><button id="review-close" aria-label="关闭预览导航">×</button></div>
    <p>本地交互方案 · 自适应全屏背景</p>
    <nav id="review-pages"></nav>
    <div class="review-actions"><button id="replay">↻ 重播本页</button><a href="compare.html">原版 / 新版对比 ↗</a></div>
    <div class="review-sound"><button data-action="sound-toggle" aria-pressed="true"><span class="sound-indicator"></span><span data-sound-label>声音已开启</span></button><button data-action="audition-sound">试听音效</button></div>
    <p id="sound-status" class="sound-status" aria-live="polite">首次点击后启用声音</p>
    <div class="review-sound"><button data-action="restart-music">↻ 重播开场音</button><button data-action="toggle-preview-audio">暂停声音</button></div>
    <p id="music-status" class="sound-status">首次点击后播放开场音</p>
  </aside>
  <script src="ui-sound.js?v=death-soft-rupture-20261114"></script>
  <script src="home-music.js?v=completion-gold-particles-20261114"></script>
  <script src="story-tree.js?v=tree-locked-hover-20261113"></script>
  <script src="app.js?v=death-embers-visible-20261114"></script>
</body>
</html>
