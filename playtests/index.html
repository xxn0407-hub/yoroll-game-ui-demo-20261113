<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script src="../responsive-layout.js?v=mobile-ui-scale-20261116"></script>
 <meta name="theme-color" content="#090d0f">
 <title>玩法交互 · Yoroll</title>
 <link rel="icon" href="../wall/assets/yoroll-icon.svg">
 <link rel="stylesheet" href="../style.css?v=menus-hover-motion-20261116">
 <link rel="stylesheet" href="playtests.css?v=mobile-ui-scale-20261116">
  <link rel="stylesheet" href="../mobile.css?v=mobile-spacing-20261117">
</head>
<body>
 <main id="game-frame" class="game-frame suite-frame" data-page="playtests" aria-label="Yoroll 玩法界面预览">
  <div id="suite-background" class="suite-background" aria-hidden="true"></div>
  <div class="suite-shade" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div id="screen" class="screen suite-screen" aria-live="off"><div class="suite-loading"><span></span>正在准备玩法</div></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
 </main>
 <button id="suite-review-toggle" class="review-toggle" aria-expanded="false" aria-controls="suite-review">预览 <span>⌘</span></button>
 <aside id="suite-review" class="review-panel suite-review" hidden aria-label="玩法预览控制">
  <div class="review-heading"><strong>玩法与状态</strong><button data-suite="review-close" aria-label="关闭预览控制">×</button></div>
  <nav id="suite-review-modes"></nav>
  <div class="review-actions"><button data-suite="replay">↻ 重播当前玩法</button><button data-suite="hub">玩法目录</button></div>
  <div class="suite-review-states"><span>界面状态预览</span><button data-suite="preview-state" data-state="playing">进行中</button><button data-suite="preview-state" data-state="success">成功反馈</button><button data-suite="preview-state" data-state="failure">失败反馈</button></div>
  <p class="suite-review-note">原 Unity 子游戏保留独立规则，通过状态与事件接口接入此 UI 层。状态预览不会写入剧情进度。</p>
  <a class="suite-review-source" href="https://preview.game.yoroll.ai/?config=test" target="_blank" rel="noopener">查看原版玩法 ↗</a>
 </aside>
 <script src="../ui-sound.js?v=quiet-hover-priority-20261117"></script>
 <script src="audio.js?v=quiet-hover-priority-20261117"></script>
 <script src="engine/rules.js?v=mobile-ui-scale-20261116"></script>
 <script src="ui.js?v=mobile-ui-scale-20261116"></script>
 <script src="engine/session.js?v=mobile-ui-scale-20261116"></script>
 <script src="feedback.js?v=quiet-hover-priority-20261117"></script>
 <script src="native-ui.js?v=ethereal-gameplay-20261116"></script>
 <script src="interactions.js?v=ethereal-gameplay-20261116"></script>
 <script src="scenes.js?v=ethereal-gameplay-20261116"></script>
 <script src="rhythm.js?v=ethereal-gameplay-20261116"></script>
 <script src="web-game.js?v=ethereal-gameplay-20261116"></script>
 <script src="app.js?v=quiet-hover-priority-20261117"></script>
</body>
</html>
